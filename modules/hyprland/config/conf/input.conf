input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = adaptive

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
        scroll_factor = 0.75
    }
}

# Hyprland 0.51+ gesture syntax. The legacy workspace_swipe options were removed.
gesture = 3, horizontal, workspace
