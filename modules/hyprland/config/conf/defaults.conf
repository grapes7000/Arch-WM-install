# Safe visual defaults used before the theme engine generates theme.conf.
$bg = rgb(0a0a0f)
$bg_alt = rgb(15121a)
$fg = rgb(ff6ec7)
$fg_dim = rgb(c86fa6)
$accent = rgb(00e5ff)
$accent2 = rgb(ff1493)
$urgent = rgb(ff0055)

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8
    col.active_border = rgba(00e5ffff) rgba(ff1493ff) 45deg
    col.inactive_border = rgba(ff1493aa)
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000066)
    }
}
