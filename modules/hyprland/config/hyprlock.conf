general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    color = rgba(0a0a0fff)
    blur_passes = 2
    blur_size = 6
    noise = 0.01
    contrast = 1.0
    brightness = 0.75
    vibrancy = 0.15
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ff6ec7ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(c86fa6ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 72
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 3
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true
    outer_color = rgba(ff1493ff)
    inner_color = rgba(15121aff)
    font_color = rgba(ff6ec7ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##c86fa6">Password</span>
    hide_input = false
    check_color = rgba(00e5ffff)
    fail_color = rgba(ff0055ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(ffb6c1ff)
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text =   ARCH WM
    color = rgba(00e5ffff)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}
