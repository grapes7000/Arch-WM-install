# Arch WM modular Hyprland configuration
# Machine-specific overrides belong in conf/local.conf.

source = ~/.config/hypr/conf/env.conf
source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/defaults.conf
source = ~/.config/hypr/generated/theme.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/behavior.conf
source = ~/.config/hypr/conf/windowrules.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/local.conf
