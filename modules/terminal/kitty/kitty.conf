# Portable Kitty profile based on Arch-WM-install.

font_family JetBrainsMono Nerd Font
font_size 12.0
shell zsh
background_opacity 0.92

window_padding_width 10
window_border_width 1pt
confirm_os_window_close 0
remember_window_size yes
initial_window_width 110c
initial_window_height 32c

scrollback_lines 20000
scrollback_pager nvim -c 'set ft=man' -
wheel_scroll_multiplier 4.0
copy_on_select clipboard
strip_trailing_spaces smart

# Smooth cursor behavior.

cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.55
cursor_stop_blinking_after 15
cursor_trail 35
cursor_trail_decay 0.10 0.30
cursor_trail_start_threshold 1
cursor_trail_color none

shell_integration enabled
allow_hyperlinks yes
underline_hyperlinks hover
url_style curly
open_url_with default

bell_on_tab no
enable_audio_bell no
visual_bell_duration 0.0

placement_strategy center
enabled_layouts splits,stack,tall

# Keep tabs easy to notice and use.

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round

# Tabs and panes inherit the current working directory.

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+q close_tab
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab

# Explicit splits.

map ctrl+shift+v launch --cwd=current --location=vsplit
map ctrl+shift+b launch --cwd=current --location=hsplit

# Move between panes with Alt + Arrow.

map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# Resize the active pane with Ctrl + Alt + Arrow.

map ctrl+alt+left resize_window narrower 3
map ctrl+alt+right resize_window wider 3
map ctrl+alt+up resize_window taller 3
map ctrl+alt+down resize_window shorter 3

# Cycle through splits, stack, and tall layouts.

map ctrl+shift+l next_layout

# Searchable command/keybind helper.

map ctrl+shift+k command_palette

# Scrollback and terminal tools.

map ctrl+shift+h show_scrollback
map ctrl+shift+f launch --type=overlay kitten search
map ctrl+shift+u kitten unicode_input
map ctrl+shift+p kitten hints --type path --program @
map ctrl+shift+o kitten hints --type hyperlink

# Theme engine owns generated colors; behavior stays stable here.

include generated/theme.conf
