name: Validate implementation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate layouts and widget registry
        run: python scripts/validate-layouts.py
      - name: Run installer and theme tests
        run: python -m unittest discover -s tests -v
      - name: Validate pinned upstream theme catalog
        env:
          HOME: ${{ runner.temp }}/theme-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/theme-config
        run: |
          python modules/theme-engine/bin/theme-catalog-sync
          test "$(find "$XDG_CONFIG_HOME/theme-engine/themes" -maxdepth 1 -name '*.json' | wc -l)" -ge 40
          test -f "$XDG_CONFIG_HOME/theme-engine/themes/winegruv.json"
          test -f "$XDG_CONFIG_HOME/theme-engine/themes/winegruv_brown.json"
          test -f "$XDG_CONFIG_HOME/theme-engine/themes/winegruv_pastel.json"
          test -f "$XDG_CONFIG_HOME/theme-engine/themes/winegruv_luxe.json"
          python modules/theme-engine/bin/theme --validate
      - name: Lint motion QML and Hyprland Lua with Arch
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed qt6-declarative quickshell lua >/dev/null
              /usr/lib/qt6/bin/qmllint -I modules/shell \
                modules/shell/surfaces/homepage/GlassCard.qml \
                modules/shell/surfaces/homepage/HomepageSurface.qml \
                modules/shell/surfaces/bar/BarMotionHost.qml \
                modules/shell/surfaces/bar/BarSurface.qml \
                modules/shell/surfaces/bar/DrawerSurface.qml \
                modules/shell/surfaces/bar/LauncherOverlay.qml
              find modules/hyprland/config -name "*.lua" -print0 | xargs -0 -n1 luac -p
            '
      - name: Check shell scripts
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh modules/terminal/bin/term
          bash -n modules/theme-engine/bin/theme-install modules/theme-engine/bin/theme-menu
      - name: Check Python syntax
        run: |
          python -m compileall -q installer scripts/validate-layouts.py
          python -m py_compile \
            modules/theme-engine/bin/theme \
            modules/theme-engine/bin/theme-catalog-sync \
            modules/theme-engine/bin/theme-new \
            modules/theme-engine/bin/wallgen
      - name: Enforce no Eww paths
        run: bash scripts/check-legacy-widget-free.sh
