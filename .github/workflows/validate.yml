name: Validate implementation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate layouts and widget registry
        run: python scripts/validate-layouts.py
      - name: Run installer and theme tests
        run: python -m unittest discover -s tests -v
      - name: Check shell scripts
        run: bash -n install.sh uninstall.sh scripts/*.sh modules/terminal/bin/term
      - name: Check Python syntax
        run: python -m compileall -q installer modules/theme-engine/bin/theme scripts/validate-layouts.py
      - name: Enforce no Eww paths
        run: bash scripts/check-legacy-widget-free.sh
