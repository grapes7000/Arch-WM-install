name: Validate scaffold

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate layouts
        run: python scripts/validate-layouts.py
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Check shell scripts
        run: bash -n install.sh uninstall.sh scripts/*.sh
      - name: Enforce no Eww paths
        run: ./scripts/check-legacy-widget-free.sh
